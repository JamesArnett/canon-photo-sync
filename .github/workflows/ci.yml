name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run simulate
      - run: npm audit --omit=dev --audit-level=high
      - if: matrix.node == 22
        run: CHROMIUM_PATH="$(command -v google-chrome)" npm run test:browser
